[project]
name = "doomscroller"
version = "0.2.0"
description = "Telegram subscription archiver: subscribe to chats/channels, store every event in PostgreSQL, query any amount of history or just what's new."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "telethon>=1.43.2",
    "sqlmodel>=0.0.22",
    "psycopg[binary]>=3.2.0",
    "python-socks[asyncio]>=2.4.0",
    "python-dotenv>=1.0.0",
    "ollama>=0.6.2",
    "mcp>=2.3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0"]

[project.scripts]
doomscroller = "doomscroller.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["doomscroller"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
